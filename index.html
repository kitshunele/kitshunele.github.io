<style>

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Noto Sans TC","Noto Sans CJK TC","PingFang HK","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}

.cknq{display:flex;gap:8px;margin:10px 0}.cknq input{flex:1;font-size:18px}.cknm{margin:12px 0}.cknm input{width:100%;font-size:22px;padding:14px 12px;border:2px solid var(--line);border-radius:12px;box-sizing:border-box}.cknm .ckok{width:100%;margin-top:10px;min-height:60px;font-size:22px;font-weight:800}.cfgck{margin-top:12px;padding-top:10px;border-top:1px dashed #cbd5e1}

.ckbox{border-radius:16px;padding:20px 16px;margin:10px 0 14px;font-size:24px;font-weight:900;text-align:center}
.ckbox small{font-size:16px;font-weight:700}.ckbox .ckt{font-size:28px;margin:10px 0 4px}.ckbox div{font-size:17px;font-weight:700}
.ckbox.ok{background:#f0fdf4;border:3px solid #22c55e;color:#14532d}.ckbox.dup{background:#fffbeb;border:3px solid #f59e0b;color:#78350f}

.ckrow{padding:8px 0;border-bottom:1px solid var(--line);font-size:17px}.ckrow:last-child{border-bottom:0}
.worow .kv{margin:8px 0}.worow .kv span{white-space:pre-line}

.row{display:flex;gap:10px;align-items:center}

  obj(3, () => add(`<< /Title ${hex(title || 'Checklist')} /Producer (fsapp ${APP_VERSION}) /Subject ${hex(PDF_FOOT)} >>`));
  for (let i = 0; i < n; i++) { const p = pages[i], pw = p.land ? 841.89 : 595.28, ph = p.land ? 595.28 : 841.89, b = 4 + i * 3;
    const z = p.z ? new Uint8Array(await p.z) : null, jpg = z ? null : new Uint8Array(await p.blob.arrayBuffer());
    obj(b, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${b + 2} 0 R >> >> /Contents ${b + 1} 0 R >>`));
    const cs = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(b + 1, () => { add(`<< /Length ${cs.length} >>\nstream\n`); add(cs); add('\nendstream'); });
    if (z) { const ph2 = Array.from(p.pal, v => v.toString(16).padStart(2, '0')).join('');
      obj(b + 2, () => { add(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace [/Indexed /DeviceRGB 255 <${ph2}>] /BitsPerComponent 8 /Filter /FlateDecode /Length ${z.length} >>\nstream\n`); add(z); add('\nendstream'); }); }
    else obj(b + 2, () => { add(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add('\nendstream'); }); }
  const total = 4 + n * 3, xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`; for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x); add(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

const ecTxt = v => v == null ? '' : typeof v === 'number' ? String(v) : String(v).trim();

document.addEventListener('focusout', e => { const el = e.target; if (el.dataset && el.dataset.floor) setTimeout(() => floorHint(el), 0); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
window.addEventListener('pagehide', () => Store.flush());

  <div class="mut" style="margin-top:10px">版本 v${APP_VERSION}（測試版）· 草稿存喺呢部手機，提交即上傳公司 Drive · 上傳：${upCfg().url ? (upCfg().pin ? '已設定' : '⚠ 未填 PIN') : '⚠ 未設定網址'} · 紀錄 ${Store.recs.length} 個 · 已上傳 ${(Store.prefs.history || []).length} 份 · 相片儲存：${PhotoDB.db ? 'IndexedDB' : '⚠ 只存喺記憶體'}</div>
  <div class="acts"><button class="btn" data-m="0">關閉</button></div></div>`;
  m.classList.add('show'); m.onclick = e => { if (e.target === m || e.target.closest('[data-m]')) { m.classList.remove('show'); m.onclick = null; } };
}

  ask('使用說明', `<ol class="list">
  <li>主頁撳「＋ 新增一座」，揀屋邨、樓名（可以喺清單揀，或者直接打字）、日期。</li>
  <li>做完一座，下一座可以撳「📋 選擇樓宇」，喺「📱 呢部機」或者「☁️ 上傳紀錄」（公司 Drive，要網址＋PIN）揀返做過嘅一座 →「📋 複製樓宇」（問卷答案會照抄，記得逐條核對）或者「📄 查看 PDF」（睇返成套 check list）。</li>
  <li>「問卷」照公司 Excel 工作表2 答有／冇；答「冇」嘅系統會自動略過。</li>
  <li>每份表逐項撳 ✓／X／NA。揀 X 一定要寫原因／建議，可以影相。CL-A 總表唔使填（由問卷自動）。</li>
  <li>TR-C2、TR-H2 嘅讀數要自己輸入（一個小數位），App 唔會自動填。</li>

  <li>問卷答「有」嘅系統會多出「消防處·…」頁：消防處年檢核對表（照官方通函），逐項揀 是／否／不適用；「否」要寫備註（位置）。</li>
  <li>最後去「提交」：直接上傳到公司 Google Drive（第一次要喺 ☰「⚙️ 上傳設定」填網址同 PIN）。唔會喺手機存檔。</li>
  <li>上傳成功後，手機上嗰座嘅資料同相片會刪走，只留一行紀錄；要睇返就用 ☰「🔎 查閱紀錄」。</li>
  <li>冇網就顯示「未上傳」，有網會自動再試，或者撳「🔄 重新上傳」。</li></ol>`, '知道', null);

/* JSON（App 提交格式）→ 手機紀錄。opt.keepId：用返原 record_id（✏️ 修改）；opt.photo(p)：攞相（回傳 base64 或 null）；opt.folder：原資料夾 id（攞唔到嘅相留引用） */
async function recFromJson(o, opt) {
  opt = opt || {};
  const r = blankRecord(); if (opt.keepId && o.record_id) r.id = String(o.record_id);
  r.estate = Object.assign({}, o.estate); r.block = Object.assign({}, o.block); r.date = o.inspection_date; r.technician = o.technician || '';
  r.itype = o.inspection_type === 'half_yearly' ? 'half' : o.inspection_type === 'annual' ? 'annual' : (!('inspection_type' in o) ? 'annual' : ''); // 舊 JSON（v0.4.8 之前）全部係年檢
  Object.keys(o.questionnaire || {}).forEach(c => { if (!o.questionnaire[c].na && !o.questionnaire[c].implied) r.q[c] = o.questionnaire[c].a; });
  if (has(r.q.AA10) && !has(r.q.AA36)) r.q.AA36 = r.q.AA10; delete r.q.AA10; // v0.5.4：舊 JSON 嘅 AA10（花洒水缸是否在天台，重複題）→ AA36 // v0.5.2 implied（冇花灑水缸當冇／否）唔存
  Object.keys(o.forms || {}).forEach(k => Object.keys(o.forms[k].items || {}).forEach(id => { const it = o.forms[k].items[id]; if (it.result && !it.auto && it.set_by !== 'default') r.items[k + '.' + id] = { v: it.result, note: it.reason || '' }; else if (it.input && it.value != null && it.value !== '') r.items[k + '.' + id] = { n: it.value }; })); // v0.4.8 預設（set_by=default）唔存 → 跟返問卷 // 舊 v0.4.4 JSON 嘅 source／default_tick 欄位會被忽略
  const c2 = (o.readings || {}).tr_c2 || {}, c2u = (o.readings || {}).tr_c2_upfeed || {}, c2s = (o.readings || {}).tr_c2_sprinkler || {}; [c2, c2u, c2s].forEach(src => Object.keys(src).forEach(k => { const d = Object.assign({}, src[k]); delete d.label; delete d.part; delete d.kind; r.c2[k] = d; }));
  r.irAudit = ((o.readings || {}).ir_bulk_audit || []).slice();
  r.aiAudit = ((o.readings || {}).ai_accept_audit || []).slice(); /* v0.6.8 🤖 AI 建議採用紀錄 */
  r.c2._extra = { alarms: Object.keys(c2).filter(k => /^B_alarm/.test(k)).length, repeater: !!c2.B_repeater };
  const h2 = (o.readings || {}).tr_h2 || {}; r.h2 = { zones: (h2.zones && h2.zones.length) ? h2.zones : [{}], parity: h2.parity || [] };
  fsdImport(r, o.fsd_checklists);
  r.remarks = o.remarks || '';
  let got = 0, kept = 0;
  for (const p of (o.photos || [])) {
    const meta = { item: p.item || '', caption: p.caption || '', ts: p.taken_at || '' };
    let b64 = p.data_base64 || null;
    if (!b64 && opt.photo && p.file && !p.missing) { try { b64 = await opt.photo(p); } catch (e) { b64 = null; } }
    const id = newId('p');
    if (b64) { const dataUrl = 'data:image/jpeg;base64,' + b64; await PhotoDB.put({ id, rec: r.id, dataUrl, w: p.width, h: p.height }); thumbs.set(id, dataUrl); r.photos.push(Object.assign({ id }, meta)); got++; }
    else if (opt.folder && (p.file || p.kept_from)) { r.photos.push(Object.assign({ id, ref: { file: p.file, folder: (p.missing && p.kept_from) || opt.folder } }, meta)); kept++; } // 攞唔到 → 留引用（伺服器 v1.2 會由舊資料夾複製）
  }
  return { r, got, kept };
}
async function importFile(f) {
  if (!f) return;
  try {
    const o = JSON.parse(await f.text()); if (o.schema !== SCHEMA) throw new Error('唔係呢個 App 嘅檔案');
    const { r } = await recFromJson(o);
    Store.recs.push(r); Store.flush(); toast('已匯入：' + recTitle(r)); go(`#/r/${r.id}/basic`);
  } catch (e) { toast('匯入失敗：' + e.message, 4000); }
}

/* ---------- start ---------- */
(async function start() {
  Store.load(); Store.recs.forEach(syncNames);
  await PhotoDB.open();
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }
  if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) {
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    const hadCtl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); }); }).catch(() => { });
    /* v0.5.7：新版 service worker 接手 → 提示重新載入（唔自動 reload，免得打斷輸入／上傳） */
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtl || $('#updbar')) return;
      const b = document.createElement('button'); b.id = 'updbar'; b.textContent = '有新版本 ⟳ 撳呢度重新載入'; b.onclick = () => location.reload(); document.body.appendChild(b); });
  }
  parseHash(); accBoot(); await appDataBoot(); render(true); if (!accLocked() && APPD.ready) { lkAuto(); ecAuto(); woAuto(); scAuto(); ehAuto(); pwAuto(); } /* v0.6.14.3 開 App 閘；v0.6.15 公司資料由伺服器下載 */
  setTimeout(autoRetry, 2500);
})();

/* v0.5.8 ✕ 取消修改：「✏️ 修改」開出嚟嘅修改草稿（r.rev）未上傳之前可以成份放棄 → 刪走手機上呢份修改草稿（連相），
   返去「查閱紀錄」嗰份已上傳紀錄；伺服器／Drive 上面嗰份完全唔郁，亦唔會上傳任何嘢。 */
function canEditCancel(r) { return !!(r && r.rev && status(r) !== 'done'); }
async function cancelEdit(r) {
  if (!canEditCancel(r)) return;
  if (!(await ask('確定取消修改？', `改咗嘅嘢會唔記（手機上呢份修改草稿會刪走）。<br>已上傳嗰份（第 ${esc(String(r.rev.prev_revision || 1))} 版）唔會變，亦唔會上傳任何嘢。`, '取消修改', '繼續改'))) return;
  const keep = new Set(); Store.recs.forEach(x => { if (x.id !== r.id) (x.photos || []).forEach(p => keep.add(p.id)); });
  for (const p of (r.photos || [])) if (!keep.has(p.id)) await PhotoDB.del(p.id);
  const of = r.rev.of; Store.recs = Store.recs.filter(x => x.id !== r.id); Store.flush();
  toast('已取消修改；已上傳嗰份冇改過', 3000);
  return of ? go('#/records/' + encodeURIComponent(of)) : go('#/fire');
}
